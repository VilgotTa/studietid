<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studietid</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon-192.png">
<style>
  body{font-family:-apple-system,sans-serif;text-align:center;padding-top:20px;background:#111;color:#fff;padding-bottom:40px;margin:0;}
  button{font-size:24px;padding:20px 40px;margin:10px;border-radius:12px;border:none;width:80%;cursor:pointer;}
  #start{background:#2ecc71;color:#fff;margin-bottom:20px;}
  #stop{background:#e74c3c;color:#fff;}
  select, input{font-size:18px;padding:12px;margin-bottom:15px;width:80%;box-sizing:border-box;border-radius:8px;border:none;}
  #status{margin-top:20px;font-size:18px;min-height:24px;color:#f1c40f;}
  .section{margin-top:15px;padding-top:15px;border-top:1px solid #333;}
  .small-btn{font-size:16px;padding:12px;width:38%;margin:5px;border-radius:8px;}
  #add-btn{background:#3498db;color:#fff;} #archive-btn{background:#9b59b6;color:#fff;} #rem-btn{background:#e67e22;color:#fff;}
  #sync-badge{font-size:14px;color:#aaa;margin-top:10px;}
</style>
</head>
<body>

<h2>Studietid</h2>
<div id="sync-badge">Laddar status...</div>

<div id="start-section" class="section">
  <select id="course" onchange="updateStats()"><option>Laddar kategorier...</option></select><br>
  <div id="stats" style="font-size:14px;color:#bbb;margin-bottom:15px;text-align:left;padding:0 10%;line-height:1.6;"></div>
  <button id="start" onclick="startTimer()">Starta pass</button>
</div>

<div id="stop-section" class="section" style="display:none;">
  <h3 id="current-session-info" style="color:#2ecc71;">Pågående pass...</h3>
  <div id="timer" style="font-size:36px;font-weight:bold;margin-bottom:15px;">00:00:00</div>
  <input type="text" id="comment" placeholder="Vad gjorde du? (Frivilligt)" /><br>
  <select id="efficiency">
    <option value="">Hur effektiv var du? (1-5)</option>
    <option value="1">1 - Mycket låg</option>
    <option value="2">2 - Låg</option>
    <option value="3">3 - Medel</option>
    <option value="4">4 - Hög</option>
    <option value="5">5 - Mycket hög</option>
  </select><br>
  <button id="stop" onclick="stopTimer()">Stoppa & Spara</button>
  <button id="discard" onclick="discardTimer()" style="background:#7f8c8d;color:#fff;font-size:16px;padding:12px 20px;width:80%;">Stoppa utan att spara</button>
</div>

<div id="status"></div>

<div class="section">
  <h3>Hantera kategorier</h3>
  <input type="text" id="new-category" placeholder="Ny kategori..." /><br>
  <button id="add-btn" class="small-btn" onclick="addCategory()">Lägg till</button>
  <button id="archive-btn" class="small-btn" onclick="archiveCategory()">Arkivera vald</button>
  <button id="rem-btn" class="small-btn" onclick="removeCategory()">Ta bort vald</button>
</div>

<div class="section">
  <h3>Arkiverade ämnen</h3>
  <select id="archived-course"><option value="">Inga arkiverade ämnen</option></select><br>
  <button id="restore-btn" class="small-btn" style="width:80%;background:#2ecc71;color:#fff;" onclick="restoreCategory()">Återställ vald</button>
</div>

<script>
// ====== KONFIGURATION ======
// Byt ut mot din Apps Script-webbapps-URL (måste sluta på /exec)
var API_URL = 'https://script.google.com/macros/s/AKfycbyk5eGIeF5fCQwM666EG_rTQjG-hkcep5hUbL7iwn2tEIgBJxfC4C4J4PXYNF8ZdOX6yQ/exec';
// Samma token som TOKEN-konstanten i Apps Script-koden
var API_TOKEN = 'Superstudent';
// ============================

window.onload = function () {
  loadCategoriesLocally();
  updateUI();
  syncAll();
};

function apiGet(action) {
  return fetch(API_URL + '?action=' + action + '&token=' + encodeURIComponent(API_TOKEN), {
    signal: AbortSignal.timeout(15000),
  }).then(function (r) { return r.json(); });
}

function apiPost(payload) {
  payload.token = API_TOKEN;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // undviker CORS-preflight
    body: JSON.stringify(payload),
    signal: AbortSignal.timeout(15000),
  }).then(function (r) { return r.json(); });
}

// Räknas upp vid varje lokal start/stopp så att ett svar från servern som hann bli gammalt inte skriver över det.
var runningEpoch = 0;

function markRunningChanged() {
  runningEpoch++;
  localStorage.setItem('running_dirty', '1');
}

function fetchState() {
  var epoch = runningEpoch;
  return apiGet('getState')
    .then(function (state) { applyState(state, epoch); })
    .catch(function () { /* offline - kör vidare på lokala data */ });
}

function applyState(state, epoch) {
  if (!state || !Array.isArray(state.categories)) return;
  var archived = Array.isArray(state.archived) ? state.archived : [];

  var catsJson = JSON.stringify(state.categories);
  var archivedChanged = JSON.stringify(archived) !== JSON.stringify(getArchived());
  if (catsJson !== localStorage.getItem('categories') || archivedChanged) {
    localStorage.setItem('categories', catsJson);
    setArchived(archived);
    renderCategories(state.categories);
  }

  // Pågående pass: servern gäller, förutom när den här enheten har en ännu ej uppladdad ändring.
  if (epoch !== runningEpoch || localStorage.getItem('running_dirty')) return;
  var remote = state.running;
  var local = localStorage.getItem('running_start');
  if (remote && typeof remote.start === 'number') {
    if (String(remote.start) !== local) {
      localStorage.setItem('running_start', remote.start);
      localStorage.setItem('running_course', remote.course || '');
      updateUI();
    }
  } else if (local) {
    localStorage.removeItem('running_start');
    localStorage.removeItem('running_course');
    document.getElementById('comment').value = '';
    document.getElementById('efficiency').value = '';
    updateUI();
  }
}

function syncRunning() {
  if (!navigator.onLine || !localStorage.getItem('running_dirty')) return Promise.resolve();
  var epoch = runningEpoch;
  var startMs = localStorage.getItem('running_start');
  var req = startMs
    ? apiPost({ action: 'startSession', start: parseInt(startMs), course: localStorage.getItem('running_course') || '' })
    : apiPost({ action: 'clearRunning' });
  return req
    .then(function (state) {
      if (state && state.error) return;
      if (epoch === runningEpoch) localStorage.removeItem('running_dirty');
    })
    .catch(function () { /* försöker igen vid nästa synk */ });
}

// Allt som pratar med servern går i kö, så start/stopp/sparning når servern i rätt ordning.
var syncChain = Promise.resolve();

function syncAll() {
  syncChain = syncChain
    .then(function () { return syncQueue(); })
    .then(syncRunning)
    .then(fetchState)
    .then(fetchStats)
    .catch(function () {});
  return syncChain;
}

var timerInterval = null;

function formatElapsed(ms) {
  var totalSec = Math.floor(ms / 1000);
  var h = Math.floor(totalSec / 3600);
  var m = Math.floor((totalSec % 3600) / 60);
  var s = totalSec % 60;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}

function tickTimer() {
  var startMs = parseInt(localStorage.getItem('running_start'));
  document.getElementById('timer').innerText = formatElapsed(new Date().getTime() - startMs);
}

function updateUI() {
  var startMs = localStorage.getItem('running_start');
  var course = localStorage.getItem('running_course');
  if (startMs) {
    document.getElementById('start-section').style.display = 'none';
    document.getElementById('stop-section').style.display = 'block';
    document.getElementById('current-session-info').innerText = 'Kör: ' + course;
    if (!timerInterval) {
      tickTimer();
      timerInterval = setInterval(tickTimer, 1000);
    }
  } else {
    document.getElementById('start-section').style.display = 'block';
    document.getElementById('stop-section').style.display = 'none';
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    document.getElementById('timer').innerText = '00:00:00';
  }
  updateSyncBadge();
}

function updateSyncBadge() {
  var queue = JSON.parse(localStorage.getItem('sync_queue') || '[]');
  var badge = document.getElementById('sync-badge');
  if (queue.length > 0) {
    badge.innerText = '⏳ ' + queue.length + ' pass väntar på synk (Offline)';
    badge.style.color = '#e67e22';
  } else {
    badge.innerText = '✓ Allt synkat';
    badge.style.color = '#aaa';
  }
}

function startTimer() {
  var c = document.getElementById('course').value;
  localStorage.setItem('running_course', c);
  localStorage.setItem('running_start', new Date().getTime());
  markRunningChanged();
  document.getElementById('status').innerText = 'Startade lokalt!';
  setTimeout(function () { document.getElementById('status').innerText = ''; }, 2000);
  updateUI();
  syncAll();
}

function stopTimer() {
  var startMs = parseInt(localStorage.getItem('running_start'));
  var course = localStorage.getItem('running_course');
  var stopMs = new Date().getTime();
  var minutes = Math.round((stopMs - startMs) / 60000);
  var comment = document.getElementById('comment').value;
  var efficiency = document.getElementById('efficiency').value;

  var session = {
    course: course, start: startMs, stop: stopMs,
    minutes: minutes, comment: comment, efficiency: efficiency,
  };

  var queue = JSON.parse(localStorage.getItem('sync_queue') || '[]');
  queue.push(session);
  localStorage.setItem('sync_queue', JSON.stringify(queue));
  localStorage.removeItem('running_start');
  localStorage.removeItem('running_course');
  markRunningChanged();
  document.getElementById('comment').value = '';
  document.getElementById('efficiency').value = '';
  document.getElementById('status').innerText = 'Pass sparat lokalt! (' + minutes + ' min)';

  updateUI();
  updateStats();
  syncAll();
}

function discardTimer() {
  if (!confirm('Avbryt passet utan att spara?')) return;
  localStorage.removeItem('running_start');
  localStorage.removeItem('running_course');
  markRunningChanged();
  document.getElementById('comment').value = '';
  document.getElementById('efficiency').value = '';
  document.getElementById('status').innerText = 'Pass avbrutet, sparades inte.';
  setTimeout(function () { document.getElementById('status').innerText = ''; }, 2000);
  updateUI();
  syncAll();
}

function syncQueue() {
  if (!navigator.onLine) return Promise.resolve();
  var queue = JSON.parse(localStorage.getItem('sync_queue') || '[]');
  if (queue.length === 0) return Promise.resolve();

  document.getElementById('status').innerText = 'Synkar ' + queue.length + ' pass...';

  return apiPost({ action: 'saveSessions', sessions: queue })
    .then(function () {
      localStorage.setItem('sync_queue', '[]');
      statsStale = true;
      document.getElementById('status').innerText = 'Synkad med Google Sheets!';
      updateSyncBadge();
      setTimeout(function () { document.getElementById('status').innerText = ''; }, 3000);
    })
    .catch(function () {
      document.getElementById('status').innerText = 'Nätverksfel. Sparat lokalt, synkar senare.';
    });
}

function loadCategoriesLocally() {
  var cats = JSON.parse(localStorage.getItem('categories') || '[]');
  if (cats.length > 0) renderCategories(cats);
}

function saveCategoriesLocally(cats) {
  localStorage.setItem('categories', JSON.stringify(cats));
  renderCategories(cats);
}

function getArchived() {
  return JSON.parse(localStorage.getItem('archived_categories') || '[]');
}

function setArchived(names) {
  localStorage.setItem('archived_categories', JSON.stringify(names));
}

function renderCategories(cats) {
  // Ta bort arkiverade namn som inte längre finns bland kategorierna (t.ex. borttagna på servern).
  var archived = getArchived().filter(function (name) { return cats.indexOf(name) !== -1; });
  setArchived(archived);
  var bySwedish = function (a, b) { return a.localeCompare(b, 'sv'); };
  var active = cats.filter(function (c) { return archived.indexOf(c) === -1 && c !== 'Övrigt'; }).sort(bySwedish);
  if (cats.indexOf('Övrigt') !== -1 && archived.indexOf('Övrigt') === -1) active.push('Övrigt');
  archived = archived.slice().sort(bySwedish);

  var sel = document.getElementById('course');
  var prevCourse = sel.value;
  sel.innerHTML = '';
  for (var i = 0; i < active.length; i++) {
    var opt = document.createElement('option');
    opt.value = active[i]; opt.innerText = active[i];
    sel.appendChild(opt);
  }
  if (active.indexOf(prevCourse) !== -1) sel.value = prevCourse;

  var archSel = document.getElementById('archived-course');
  var prevArchived = archSel.value;
  archSel.innerHTML = '';
  if (archived.length === 0) {
    var noneOpt = document.createElement('option');
    noneOpt.value = ''; noneOpt.innerText = 'Inga arkiverade ämnen';
    archSel.appendChild(noneOpt);
  } else {
    for (var j = 0; j < archived.length; j++) {
      var aopt = document.createElement('option');
      aopt.value = archived[j]; aopt.innerText = archived[j];
      archSel.appendChild(aopt);
    }
    if (archived.indexOf(prevArchived) !== -1) archSel.value = prevArchived;
  }

  updateStats();
}

var statsStale = true;
var lastStatsFetch = 0;

// Statistiken hämtas från Google Sheet (summerad per dag och ämne) och cachas lokalt för offline-läge.
function fetchStats() {
  if (!navigator.onLine) return Promise.resolve();
  if (!statsStale && Date.now() - lastStatsFetch < 60000) return Promise.resolve();
  return apiGet('getStats')
    .then(function (res) {
      if (!res || !Array.isArray(res.rows)) return;
      localStorage.setItem('stats_cache', JSON.stringify(res.rows));
      statsStale = false;
      lastStatsFetch = Date.now();
      updateStats();
    })
    .catch(function () { /* offline - visar senast hämtade siffror */ });
}

function formatMinutes(min) {
  var h = Math.floor(min / 60);
  var m = min % 60;
  return h > 0 ? (h + ' h ' + m + ' min') : (m + ' min');
}

function updateStats() {
  var statsEl = document.getElementById('stats');
  if (!statsEl) return;
  var course = document.getElementById('course').value;
  var today = new Date().toLocaleDateString('sv-SE');

  // Sparade pass från sheetet plus pass som ännu väntar på synk på den här enheten.
  var rows = JSON.parse(localStorage.getItem('stats_cache') || '[]');
  var queue = JSON.parse(localStorage.getItem('sync_queue') || '[]');
  for (var q = 0; q < queue.length; q++) {
    rows.push({
      date: new Date(queue[q].start).toLocaleDateString('sv-SE'),
      course: queue[q].course,
      minutes: queue[q].minutes,
    });
  }

  var todayCourseMin = 0, totalCourseMin = 0, todayAllMin = 0, totalAllMin = 0;
  for (var i = 0; i < rows.length; i++) {
    var h = rows[i];
    totalAllMin += h.minutes;
    if (h.date === today) todayAllMin += h.minutes;
    if (h.course === course) {
      totalCourseMin += h.minutes;
      if (h.date === today) todayCourseMin += h.minutes;
    }
  }

  statsEl.style.whiteSpace = 'pre-line';
  statsEl.textContent = course
    ? ('Idag i ' + course + ': ' + formatMinutes(todayCourseMin) + '\n' +
       'Totalt i ' + course + ': ' + formatMinutes(totalCourseMin) + '\n' +
       'Idag totalt: ' + formatMinutes(todayAllMin) + '\n' +
       'Totalt: ' + formatMinutes(totalAllMin))
    : '';
}

function changeArchive(action, name, doneText, failText) {
  document.getElementById('status').innerText = '...';
  apiPost({ action: action, name: name })
    .then(function (state) {
      if (!state || state.error) throw new Error('bad response');
      applyState(state, runningEpoch);
      document.getElementById('status').innerText = doneText;
      setTimeout(function () { document.getElementById('status').innerText = ''; }, 2000);
    })
    .catch(function () {
      document.getElementById('status').innerText = failText;
    });
}

function archiveCategory() {
  var selVal = document.getElementById('course').value;
  if (!selVal) return;
  changeArchive('archiveCat', selVal, 'Ämne arkiverat.', 'Kunde inte arkivera (offline?).');
}

function restoreCategory() {
  var selVal = document.getElementById('archived-course').value;
  if (!selVal) return;
  changeArchive('restoreCat', selVal, 'Ämne återställt.', 'Kunde inte återställa (offline?).');
}

function addCategory() {
  var newVal = document.getElementById('new-category').value.trim();
  if (!newVal) return;
  document.getElementById('status').innerText = 'Lägger till...';
  apiPost({ action: 'addCat', name: newVal })
    .then(function (cats) {
      saveCategoriesLocally(cats);
      document.getElementById('new-category').value = '';
      document.getElementById('status').innerText = 'Kategori tillagd!';
    })
    .catch(function () {
      document.getElementById('status').innerText = 'Kunde inte lägga till (offline?).';
    });
}

function removeCategory() {
  var selVal = document.getElementById('course').value;
  if (!selVal) return;
  if (!confirm('Vill du ta bort: ' + selVal + '?')) return;
  document.getElementById('status').innerText = 'Tar bort...';
  apiPost({ action: 'removeCat', name: selVal })
    .then(function (cats) {
      saveCategoriesLocally(cats);
      document.getElementById('status').innerText = 'Kategori borttagen!';
    })
    .catch(function () {
      document.getElementById('status').innerText = 'Kunde inte ta bort (offline?).';
    });
}

function refreshNow() {
  statsStale = true;
  syncAll();
}

window.addEventListener('online', refreshNow);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshNow(); });
setInterval(function () { if (!document.hidden) syncAll(); }, 20000);
</script>
</body>
</html>
